<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bandeja de evaluacion - LicenControl')}"></head>

<body class="app-body">
	<div class="d-flex">
		<aside th:replace="~{fragments/layout :: sidebar('bandeja')}"></aside>

		<div class="flex-grow-1 d-flex flex-column" style="min-width:0">
			<header th:replace="~{fragments/layout :: encabezado}"></header>

			<main class="flex-grow-1">
				<div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
				<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

				<div class="panel">
					<div class="panel-titulo">
						<h2><i class="bi bi-clipboard-data"></i>Mis expedientes por evaluar</h2>
					</div>

					<div class="table-responsive">
						<table class="table table-striped table-bordered align-middle">
							<thead>
								<tr>
									<th></th>
									<th>N. de expediente</th>
									<th>Nombre comercial</th>
									<th>Giro</th>
									<th>Local</th>
									<th>Fecha limite</th>
									<th>Dias restantes</th>
									<th></th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="f : ${filas}">
									<td class="text-center"><span class="semaforo" th:classappend="${f.semaforo}"></span></td>
									<td th:text="${f.expediente.numero} ?: '&#8212;'"></td>
									<td th:text="${f.expediente.nombreComercial}"></td>
									<td th:text="${f.expediente.giro.nombre}"></td>
									<td th:text="${f.expediente.establecimiento.viaTipo + ' ' + f.expediente.establecimiento.viaNombre + ' ' + f.expediente.establecimiento.numero}"></td>
									<td th:text="${f.expediente.fechaLimite != null} ? ${#temporals.format(f.expediente.fechaLimite, 'dd/MM/yyyy')} : '&#8212;'"></td>
									<td th:text="${f.diasRestantes == null ? '&#8212;' : (f.diasRestantes lt 0 ? 'Vencido' : f.diasRestantes + ' dias')}"></td>
									<td><a class="btn btn-sm btn-muni" th:href="@{/tecnico/evaluar/{id}(id=${f.expediente.idExpediente})}">Evaluar</a></td>
								</tr>
								<tr th:if="${#lists.isEmpty(filas)}">
									<td colspan="8" class="text-center text-muted">No tienes expedientes asignados para evaluar.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</main>

			<footer th:replace="~{fragments/layout :: pie}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
