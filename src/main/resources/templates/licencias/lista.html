<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Licencias emitidas - Licencias de Funcionamiento</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>

	<body class="bg-light">
		<div class="container py-4">
			<h1 class="h3">Sistema de Licencias de Funcionamiento</h1>
			<p class="text-muted">Municipalidad de Independencia</p>
		</div>

		<main class="container pb-5">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h2 class="h4 mb-3">Licencias emitidas</h2>

					<form th:action="@{/licencias}" method="get" class="row g-3 align-items-end mb-4">
						<div class="col-md-3">
							<label for="desde" class="form-label">Desde</label>
							<input type="date" class="form-control" id="desde" name="desde" th:value="${desde}">
						</div>
						<div class="col-md-3">
							<label for="hasta" class="form-label">Hasta</label>
							<input type="date" class="form-control" id="hasta" name="hasta" th:value="${hasta}">
						</div>
						<div class="col-md-3">
							<label for="giro" class="form-label">Giro</label>
							<select class="form-select" id="giro" name="giro">
								<option value="">Todos</option>
								<option th:each="g : ${giros}" th:value="${g.codigo}" th:text="${g.nombre}"
									th:selected="${giro != null and giro == g.codigo}"></option>
							</select>
						</div>
						<div class="col-md-3">
							<button type="submit" class="btn btn-primary">Buscar</button>
							<a th:href="@{/licencias}" class="btn btn-secondary">Limpiar</a>
						</div>
					</form>

					<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

					<div class="table-responsive">
						<table class="table table-striped table-bordered align-middle">
							<thead class="table-light">
								<tr>
									<th>N.° de licencia</th>
									<th>N.° de expediente</th>
									<th>Nombre comercial</th>
									<th>Titular</th>
									<th>Giro</th>
									<th>Fecha de emisión</th>
									<th>Estado</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="l : ${licencias}">
									<td th:text="${l.numero}"></td>
									<td th:text="${l.expediente.numero}"></td>
									<td th:text="${l.expediente.nombreComercial}"></td>
									<td th:text="${l.expediente.administrado.nombres + ' ' + l.expediente.administrado.apellidos}"></td>
									<td th:text="${l.expediente.giro.nombre}"></td>
									<td th:text="${#temporals.format(l.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
									<td>
										<span class="badge" th:text="${l.estado}"
											th:classappend="${l.estado == 'VIGENTE'} ? 'bg-success' : 'bg-danger'"></span>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(licencias)}">
									<td colspan="7" class="text-center text-muted">No se encontraron licencias.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
