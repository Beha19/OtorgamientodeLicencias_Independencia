<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Feriados - Licencias de Funcionamiento</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>

	<body class="bg-light">
		<!-- Aqui ira el encabezado/menu comun de Bea -->
		<div class="container py-4">
			<h1 class="h3">Sistema de Licencias de Funcionamiento</h1>
			<p class="text-muted">Municipalidad de Independencia</p>
		</div>

		<main class="container pb-5" style="max-width: 900px;">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h2 class="h4 mb-1">Feriados</h2>
					<p class="text-muted">Se usan para calcular los plazos en días hábiles.</p>

					<!-- Tarea 4: aqui se conectara el guardado -->
					<form action="#" method="post" class="row g-3 align-items-end mb-4">
						<div class="col-md-4">
							<label for="fecha" class="form-label">Fecha</label>
							<input type="date" class="form-control" id="fecha" name="fecha">
						</div>
						<div class="col-md-5">
							<label for="descripcion" class="form-label">Descripción</label>
							<input type="text" class="form-control" id="descripcion" name="descripcion" maxlength="100">
						</div>
						<div class="col-md-3">
							<button type="submit" class="btn btn-primary w-100">Agregar</button>
						</div>
					</form>

					<!-- Tarea 4: reemplazar las filas de ejemplo por th:each="f : ${feriados}" -->
					<div class="table-responsive">
						<table class="table table-striped table-bordered align-middle">
							<thead class="table-light">
								<tr>
									<th>Fecha</th>
									<th>Descripción</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>2026-10-08</td>
									<td>Combate de Angamos</td>
									<td>
										<a href="#" class="btn btn-sm btn-outline-secondary">Editar</a>
										<form action="#" method="post" class="d-inline">
											<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
										</form>
									</td>
								</tr>
								<tr>
									<td>2026-11-01</td>
									<td>Todos los Santos</td>
									<td>
										<a href="#" class="btn btn-sm btn-outline-secondary">Editar</a>
										<form action="#" method="post" class="d-inline">
											<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
										</form>
									</td>
								</tr>
								<tr>
									<td>2026-12-25</td>
									<td>Navidad</td>
									<td>
										<a href="#" class="btn btn-sm btn-outline-secondary">Editar</a>
										<form action="#" method="post" class="d-inline">
											<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
										</form>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
