<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Feriados - LicenControl')}"></head>

<body class="app-body">
	<div class="d-flex">
		<aside th:replace="~{fragments/layout :: sidebar('feriados')}"></aside>

		<div class="flex-grow-1 d-flex flex-column" style="min-width:0">
			<header th:replace="~{fragments/layout :: encabezado}"></header>

			<main class="flex-grow-1">
				<div class="panel">
					<div class="panel-titulo">
						<h2><i class="bi bi-calendar-event"></i>Feriados</h2>
					</div>
					<p class="text-muted">Se usan para calcular los plazos en días hábiles.</p>

					<div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
					<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

					<form th:action="@{/admin/feriados/guardar}" th:object="${feriado}" method="post"
						class="row g-3 align-items-start mb-4" novalidate>
						<input type="hidden" th:field="*{edicion}">

						<div class="col-md-4">
							<label for="fecha" class="form-label">Fecha</label>
							<input type="date" class="form-control" th:field="*{fecha}" th:readonly="*{edicion}"
								th:classappend="${#fields.hasErrors('fecha')} ? 'is-invalid'">
							<div class="text-danger small" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
						</div>
						<div class="col-md-5">
							<label for="descripcion" class="form-label">Descripción</label>
							<input type="text" class="form-control" th:field="*{descripcion}" maxlength="100"
								th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'">
							<div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
						</div>
						<div class="col-md-3 pt-md-4 mt-md-1">
							<button type="submit" class="btn btn-primary"
								th:text="*{edicion} ? 'Actualizar' : 'Agregar'">Agregar</button>
							<a th:href="@{/admin/feriados}" class="btn btn-secondary" th:if="*{edicion}">Cancelar</a>
						</div>
					</form>

					<div class="table-responsive">
						<table class="table table-striped table-bordered align-middle">
							<thead>
								<tr>
									<th>Fecha</th>
									<th>Descripción</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="f : ${feriados}">
									<td th:text="${f.fecha}"></td>
									<td th:text="${f.descripcion}"></td>
									<td>
										<a th:href="@{/admin/feriados/{fecha}/editar(fecha=${f.fecha})}"
											class="btn btn-sm btn-outline-secondary">Editar</a>
										<form th:action="@{/admin/feriados/{fecha}/eliminar(fecha=${f.fecha})}"
											method="post" class="d-inline"
											onsubmit="return confirm('¿Eliminar este feriado?');">
											<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
										</form>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(feriados)}">
									<td colspan="3" class="text-center text-muted">No hay feriados registrados.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</main>

			<footer th:replace="~{fragments/layout :: pie}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
