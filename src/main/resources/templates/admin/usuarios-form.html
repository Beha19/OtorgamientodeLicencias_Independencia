<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Formulario de usuario - Licencias de Funcionamiento</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>

	<body class="bg-light">
		<!-- Aqui ira el encabezado/menu comun de Bea -->
		<div class="container py-4">
			<h1 class="h3">Sistema de Licencias de Funcionamiento</h1>
			<p class="text-muted">Municipalidad de Independencia</p>
		</div>

		<main class="container pb-5" style="max-width: 720px;">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<!-- Tarea 3: el mismo formulario sirve para nuevo y editar -->
					<h2 class="h4 mb-3">Nuevo usuario</h2>

					<form action="#" method="post">
						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="dni" class="form-label">DNI</label>
								<input type="text" class="form-control" id="dni" name="dni" maxlength="8">
							</div>
							<div class="col-md-6 mb-3">
								<label for="rol" class="form-label">Rol</label>
								<select class="form-select" id="rol" name="rol">
									<option value="ADMINISTRADO">ADMINISTRADO</option>
									<option value="REVISOR">REVISOR (mesa de partes)</option>
									<option value="TECNICO">TECNICO</option>
									<option value="SUBGERENTE">SUBGERENTE</option>
									<option value="ADMIN">ADMIN</option>
								</select>
							</div>
						</div>

						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="nombres" class="form-label">Nombres</label>
								<input type="text" class="form-control" id="nombres" name="nombres" maxlength="100">
							</div>
							<div class="col-md-6 mb-3">
								<label for="apellidos" class="form-label">Apellidos</label>
								<input type="text" class="form-control" id="apellidos" name="apellidos" maxlength="100">
							</div>
						</div>

						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="correo" class="form-label">Correo electrónico</label>
								<input type="email" class="form-control" id="correo" name="correo" maxlength="100">
							</div>
							<div class="col-md-6 mb-3">
								<label for="telefono" class="form-label">Teléfono</label>
								<input type="text" class="form-control" id="telefono" name="telefono" maxlength="9">
							</div>
						</div>

						<div class="mb-4">
							<label for="clave" class="form-label">Contraseña</label>
							<input type="password" class="form-control" id="clave" name="clave" maxlength="60"
								placeholder="Al editar, déjala vacía para no cambiarla">
						</div>

						<button type="submit" class="btn btn-primary">Guardar</button>
						<a th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
					</form>
				</div>
			</div>
		</main>
	</body>
</html>
