
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mantenimiento de giros - LicenControl')}"></head>

<body class="app-body">
    <div class="d-flex">
        <aside th:replace="~{fragments/layout :: sidebar('giros')}"></aside>

        <div class="flex-grow-1 d-flex flex-column" style="min-width:0">
            <header th:replace="~{fragments/layout :: encabezado}"></header>

            <main class="flex-grow-1 container-fluid p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3">Mantenimiento de giros</h1>
                        <p class="text-muted">Administra los giros comerciales y sus zonas permitidas.</p>
                    </div>
                    <a class="btn btn-primary" th:href="@{/admin/giros/nuevo}">
                        <i class="bi bi-plus-circle me-1"></i> Nuevo giro
                    </a>
                </div>

                <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

                <div class="panel">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Código CIIU</th>
                                    <th>Nombre</th>
                                    <th>Nivel de riesgo</th>
                                    <th>Estado</th>
                                    <th>Zonas permitidas</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="giro : ${giros}">
                                    <td th:text="${giro.codigoCiiu}"></td>
                                    <td th:text="${giro.nombre}"></td>
                                    <td th:text="${giro.nivelRiesgo}"></td>
                                    <td>
                                        <span th:if="${giro.activo}" class="badge text-bg-success">Activo</span>
                                        <span th:unless="${giro.activo}" class="badge text-bg-secondary">Inactivo</span>
                                    </td>
                                    <td>
                                        <span th:each="zona, iter : ${giro.zonasPermitidas}">
                                            <span th:text="${zona.nombre}"></span><span th:if="${!iter.last}">, </span>
                                        </span>
                                    </td>
                                    <td class="text-nowrap">
                                        <a class="btn btn-sm btn-outline-primary"
                                           th:href="@{/admin/giros/editar/{id}(id=${giro.idGiro})}">
                                            Editar
                                        </a>
                                        <form th:if="${giro.activo}"
                                              th:action="@{/admin/giros/desactivar/{id}(id=${giro.idGiro})}"
                                              method="post" class="d-inline">
                                            <button class="btn btn-sm btn-outline-danger" type="submit">
                                                Desactivar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(giros)}">
                                    <td colspan="6" class="text-center text-muted py-4">
                                        No hay giros registrados.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>

            <footer th:replace="~{fragments/layout :: pie}"></footer>
        </div>
    </div>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
