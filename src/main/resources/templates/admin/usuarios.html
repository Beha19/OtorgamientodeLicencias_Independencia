<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Usuarios - Licencias de Funcionamiento</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>

	<body class="bg-light">
		
		<div class="container py-4">
			<h1 class="h3">Sistema de Licencias de Funcionamiento</h1>
			<p class="text-muted">Municipalidad de Independencia</p>
		</div>

		<main class="container pb-5">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<div class="d-flex justify-content-between align-items-center mb-3">
						<h2 class="h4 mb-0">Usuarios</h2>
						<a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary">Nuevo usuario</a>
					</div>

					<div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
					<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

					<div class="table-responsive">
						<table class="table table-striped table-bordered align-middle">
							<thead class="table-light">
								<tr>
									<th>DNI</th>
									<th>Nombres</th>
									<th>Apellidos</th>
									<th>Correo</th>
									<th>Rol</th>
									<th>Estado</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="u : ${usuarios}">
									<td th:text="${u.dni}"></td>
									<td th:text="${u.nombres}"></td>
									<td th:text="${u.apellidos}"></td>
									<td th:text="${u.correo}"></td>
									<td th:text="${u.rol}"></td>
									<td>
										<span class="badge bg-success" th:if="${u.activo}">Activo</span>
										<span class="badge bg-secondary" th:unless="${u.activo}">Inactivo</span>
									</td>
									<td>
										<a th:href="@{/admin/usuarios/{codigo}/editar(codigo=${u.codigo})}"
											class="btn btn-sm btn-outline-secondary">Editar</a>
										<form th:action="@{/admin/usuarios/{codigo}/desactivar(codigo=${u.codigo})}"
											method="post" class="d-inline" th:if="${u.activo}"
											onsubmit="return confirm('¿Desactivar este usuario?');">
											<button type="submit" class="btn btn-sm btn-outline-danger">Desactivar</button>
										</form>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(usuarios)}">
									<td colspan="7" class="text-center text-muted">No hay usuarios registrados.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
