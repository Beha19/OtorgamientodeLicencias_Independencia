<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios - LicenControl')}"></head>

<body class="app-body">
	<div class="d-flex">
		<aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>

		<div class="flex-grow-1 d-flex flex-column" style="min-width:0">
			<header th:replace="~{fragments/layout :: encabezado}"></header>

			<main class="flex-grow-1">
				<div class="panel">
					<div class="panel-titulo">
						<h2><i class="bi bi-people"></i>Usuarios</h2>
						<a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary btn-sm">
							<i class="bi bi-person-plus"></i> Nuevo usuario
						</a>
					</div>

					<div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
					<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

					<div class="table-responsive">
						<table class="table table-striped table-bordered align-middle">
							<thead>
								<tr>
									<th>DNI</th>
									<th>Nombres</th>
									<th>Apellidos</th>
									<th>Correo</th>
									<th>Rol</th>
									<th>Estado</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="u : ${usuarios}">
									<td th:text="${u.dni}"></td>
									<td th:text="${u.nombres}"></td>
									<td th:text="${u.apellidos}"></td>
									<td th:text="${u.correo}"></td>
									<td th:text="${u.rol}"></td>
									<td>
										<span class="badge bg-success" th:if="${u.activo}">Activo</span>
										<span class="badge bg-secondary" th:unless="${u.activo}">Inactivo</span>
									</td>
									<td>
										<a th:href="@{/admin/usuarios/{id}/editar(id=${u.idUsuario})}"
											class="btn btn-sm btn-outline-secondary">Editar</a>
										<form th:action="@{/admin/usuarios/{id}/desactivar(id=${u.idUsuario})}"
											method="post" class="d-inline" th:if="${u.activo}"
											onsubmit="return confirm('¿Desactivar este usuario?');">
											<button type="submit" class="btn btn-sm btn-outline-danger">Desactivar</button>
										</form>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(usuarios)}">
									<td colspan="7" class="text-center text-muted">No hay usuarios registrados.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</main>

			<footer th:replace="~{fragments/layout :: pie}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
