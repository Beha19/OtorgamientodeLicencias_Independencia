<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio - LicenControl')}"></head>

<body class="app-body">
	<div class="d-flex">
	  <aside th:replace="~{fragments/layout :: sidebar('inicio')}"></aside>
	
	  <div class="flex-grow-1 d-flex flex-column" style="min-width:0">
	    <header th:replace="~{fragments/layout :: encabezado}"></header>
	
	    <main class="flex-grow-1">
	      <!-- DATOS DE EJEMPLO: se reemplazarán con los mantenimientos reales -->
	      <div class="row g-3 mb-3">
	        <div th:replace="~{fragments/componentes :: kpi('k-amarillo','bi-people','bi-people',7,'Usuarios activos')}"></div>
	        <div th:replace="~{fragments/componentes :: kpi('k-rojo','bi-calendar-event','bi-calendar-event',3,'Feriados próximos')}"></div>
	        <div th:replace="~{fragments/componentes :: kpi('k-verde','bi-shop','bi-shop',4,'Giros activos')}"></div>
	        <div th:replace="~{fragments/componentes :: kpi('k-azul','bi-geo-alt','bi-geo-alt',6,'Zonas')}"></div>
	      </div>
	
	      <div class="row g-3 mb-3">
	        <div class="col-lg-8">
	          <div class="panel">
	            <div class="panel-titulo"><h2><i class="bi bi-bar-chart"></i>Usuarios por rol</h2></div>
	            <div class="grafico"><canvas id="g1"></canvas></div>
	          </div>
	        </div>
	        <div class="col-lg-4">
	          <div class="panel">
	            <div class="panel-titulo"><h2><i class="bi bi-lightning"></i>Accesos rápidos</h2></div>
	            <div class="accesos d-grid gap-2">
	              <a href="#"><i class="bi bi-person-plus"></i>Nuevo usuario</a>
	              <a href="#"><i class="bi bi-shop"></i>Nuevo giro</a>
	              <a href="#"><i class="bi bi-calendar-plus"></i>Nuevo feriado</a>
	            </div>
	          </div>
	        </div>
	      </div>
	
	      <div class="row g-3">
	        <div class="col-lg-7">
	          <div class="panel">
	            <div class="panel-titulo"><h2><i class="bi bi-person-lines-fill"></i>Usuarios</h2><a href="#">Ver todos</a></div>
	            <div th:replace="~{fragments/componentes :: fila('bi-clipboard-check','Rosa Quispe','revisor@muni.pe','c-amarillo','Revisor')}"></div>
	            <div th:replace="~{fragments/componentes :: fila('bi-tools','Carlos Ruiz','tecnico1@muni.pe','c-verde','Técnico')}"></div>
	            <div th:replace="~{fragments/componentes :: fila('bi-tools','Lucía Torres','tecnico2@muni.pe','c-verde','Técnico')}"></div>
	            <div th:replace="~{fragments/componentes :: fila('bi-pen','Jorge Mendoza','subgerente@muni.pe','c-vino','Subgerente')}"></div>
	          </div>
	        </div>
	        <div class="col-lg-5">
	          <div class="panel">
	            <div class="panel-titulo"><h2><i class="bi bi-calendar-event"></i>Próximos feriados</h2><a href="#">Ver calendario</a></div>
	            <div th:replace="~{fragments/componentes :: filaFecha('01','nov','Todos los Santos','Domingo','','')}"></div>
	            <div th:replace="~{fragments/componentes :: filaFecha('08','dic','Inmaculada Concepción','Martes','','')}"></div>
	            <div th:replace="~{fragments/componentes :: filaFecha('09','dic','Batalla de Ayacucho','Miércoles','','')}"></div>
	          </div>
	        </div>
	      </div>
	    </main>
	
	    <footer th:replace="~{fragments/layout :: pie}"></footer>
	  </div>
	</div>
	
	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
	<script>
	  graficoBarras('g1', ['Solicitante','Revisor','Técnico','Subgerente','Admin'], [2, 1, 2, 1, 1], COLORES.azul);
	</script>
</body>

</html>
