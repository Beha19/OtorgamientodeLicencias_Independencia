<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Crear cuenta - Licencias de Funcionamiento</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>

	<body class="bg-light">
		
		<div class="container py-4">
			<h1 class="h3">Sistema de Licencias de Funcionamiento</h1>
			<p class="text-muted">Municipalidad de Independencia</p>
		</div>

		<main class="container pb-5" style="max-width: 720px;">
			<div class="card shadow-sm">
				<div class="card-body p-4">
					<h2 class="h4 mb-3">Crear cuenta</h2>
					<p class="text-muted">Registra tus datos para presentar tu solicitud de licencia de funcionamiento.</p>

					<div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

					<form th:action="@{/cuenta/crear}" th:object="${cuenta}" method="post" novalidate>
						<div class="mb-3">
							<label for="dni" class="form-label">DNI</label>
							<div class="input-group">
								<input type="text" class="form-control" th:field="*{dni}" maxlength="8"
									placeholder="8 dígitos" th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'">
								<button type="button" class="btn btn-outline-secondary">Buscar</button>
							</div>
							<div class="text-danger small" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
						</div>

						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="nombres" class="form-label">Nombres</label>
								<input type="text" class="form-control" th:field="*{nombres}" maxlength="100"
									th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid'">
								<div class="text-danger small" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
							</div>
							<div class="col-md-6 mb-3">
								<label for="apellidos" class="form-label">Apellidos</label>
								<input type="text" class="form-control" th:field="*{apellidos}" maxlength="100"
									th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'">
								<div class="text-danger small" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
							</div>
						</div>

						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="correo" class="form-label">Correo electrónico</label>
								<input type="email" class="form-control" th:field="*{correo}" maxlength="100"
									th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
								<div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
							</div>
							<div class="col-md-6 mb-3">
								<label for="telefono" class="form-label">Teléfono (opcional)</label>
								<input type="text" class="form-control" th:field="*{telefono}" maxlength="9"
									th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
								<div class="text-danger small" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
							</div>
						</div>

						<div class="mb-4">
							<label for="clave" class="form-label">Contraseña</label>
							<input type="password" class="form-control" th:field="*{clave}" maxlength="60"
								th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid'">
							<div class="text-danger small" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></div>
						</div>

						<button type="submit" class="btn btn-primary">Crear cuenta</button>
						<a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
					</form>
				</div>
			</div>
		</main>
	</body>
</html>
