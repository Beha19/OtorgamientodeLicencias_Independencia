<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis expedientes - LicenControl')}"></head>

<body class="app-body">
	<div class="d-flex">
		<aside th:replace="~{fragments/layout :: sidebar('expedientes')}"></aside>

		<div class="flex-grow-1 d-flex flex-column" style="min-width:0">
			<header th:replace="~{fragments/layout :: encabezado}"></header>

			<main class="flex-grow-1">
				<div class="panel">
					<div class="panel-titulo">
						<h2><i class="bi bi-folder"></i>Mis expedientes</h2>
					</div>

					<div class="table-responsive">
						<table class="table table-striped table-bordered align-middle">
							<thead>
								<tr>
									<th>N.° de expediente</th>
									<th>Nombre comercial</th>
									<th>Giro</th>
									<th>Estado</th>
									<th>Fecha de registro</th>
									<th>Fecha límite</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="e : ${expedientes}">
									<td th:text="${e.numero} ?: '—'"></td>
									<td th:text="${e.nombreComercial}"></td>
									<td th:text="${e.giro.nombre}"></td>
									<td>
										<span class="badge" th:text="${e.estado}"
											th:classappend="${e.estado == 'APROBADO' ? 'bg-success'
												: (e.estado == 'DENEGADO' ? 'bg-danger'
												: (e.estado == 'OBSERVADO' ? 'bg-warning text-dark'
												: (e.estado == 'BORRADOR' or e.estado == 'PAGADO_SIN_ENVIO' ? 'bg-secondary' : 'bg-info text-dark')))}"></span>
									</td>
									<td th:text="${#temporals.format(e.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
									<td
										th:text="${e.fechaLimite != null} ? ${#temporals.format(e.fechaLimite, 'dd/MM/yyyy')} : '—'">
									</td>
									<td>
										<a th:href="@{/solicitante/expedientes/{id}(id=${e.idExpediente})}"
											class="btn btn-sm btn-outline-primary">
											<i class="bi bi-eye"></i> Ver detalle
										</a>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(expedientes)}">
									<td colspan="7" class="text-center text-muted">No tienes expedientes registrados.
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</main>

			<footer th:replace="~{fragments/layout :: pie}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
