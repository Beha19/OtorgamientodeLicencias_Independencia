<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Revisar expediente - LicenControl')}"></head>

<body class="app-body">
	<div class="d-flex">
		<aside th:replace="~{fragments/layout :: sidebar('bandeja')}"></aside>

		<div class="flex-grow-1 d-flex flex-column" style="min-width:0">
			<header th:replace="~{fragments/layout :: encabezado}"></header>

			<main class="flex-grow-1">
				<div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
				<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

				<div class="d-flex justify-content-between align-items-center mb-3">
					<h2 class="h5 mb-0"><i class="bi bi-search me-2"></i>Revisar expediente
						<span th:text="${d.expediente.numero}"></span></h2>
					<a class="btn btn-secondary btn-sm" th:href="@{/revisor/bandeja}">Volver a la bandeja</a>
				</div>

				<div th:replace="~{fragments/componentes :: datos(${d}, ${rutaDocs})}"></div>

				<div class="row g-3">
					<div class="col-lg-5">
						<div class="panel">
							<div class="panel-titulo"><h2><i class="bi bi-check2-circle"></i>Verificar</h2></div>
							<p class="small text-muted">Si la documentacion esta completa y es legible, el expediente se deriva
								automaticamente al tecnico con menos carga.</p>
							<form th:action="@{/revisor/expedientes/{id}/verificar(id=${d.expediente.idExpediente})}" method="post">
								<button type="submit" class="btn btn-success">Verificar y derivar al tecnico</button>
							</form>
						</div>
					</div>
					<div class="col-lg-7">
						<div class="panel">
							<div class="panel-titulo"><h2><i class="bi bi-exclamation-triangle"></i>Observar</h2></div>
							<form th:action="@{/revisor/expedientes/{id}/observar(id=${d.expediente.idExpediente})}" method="post">
								<label for="descripcion" class="form-label small">Observacion para el solicitante (se registra con su numero de oficio)</label>
								<textarea class="form-control mb-2" id="descripcion" name="descripcion" rows="3" required></textarea>
								<button type="submit" class="btn btn-warning">Observar expediente</button>
							</form>
						</div>
					</div>
				</div>
			</main>

			<footer th:replace="~{fragments/layout :: pie}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
